<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#f3f1ec"/>
  <rect x="60" y="60" width="1080" height="1080" rx="24" fill="#ffffff"/>
  <text x="120" y="240" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="128" font-weight="800" fill="#1f2328">等连串</text>
  <text x="120" y="320" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="40" fill="#4d545c">连续 k 次，要等多久才碰得上？</text>
  <text x="120" y="390" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" fill="#878d94">每次概率 p、试 n 次 → 碰上的可能性、平均等待、几成把握要试几次</text>
  <text x="120" y="560" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#4d545c">硬币抛 1,000 次，碰到连续 10 次正面</text><text x="1080" y="560" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="44" font-weight="700" fill="#2f6f8f">38.54%</text><line x1="120" x2="1080" y1="594" y2="594" stroke="#e1ddd4" stroke-width="2"/><text x="120" y="664" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#4d545c">平均要抛</text><text x="1080" y="664" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="44" font-weight="700" fill="#1f2328">2,046 次</text><line x1="120" x2="1080" y1="698" y2="698" stroke="#e1ddd4" stroke-width="2"/><text x="120" y="768" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#4d545c">要九成把握得抛</text><text x="1080" y="768" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="44" font-weight="700" fill="#1f2328">4,700 次</text><line x1="120" x2="1080" y1="802" y2="802" stroke="#e1ddd4" stroke-width="2"/><text x="120" y="872" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#4d545c">π 前 100 万位：同一个数字连 6 次</text><text x="1080" y="872" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="44" font-weight="700" fill="#1f2328">第 767 位</text><line x1="120" x2="1080" y1="906" y2="906" stroke="#e1ddd4" stroke-width="2"/><text x="120" y="976" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#4d545c">π 前 100 万位：连 7 次（7 个 3）</text><text x="1080" y="976" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="44" font-weight="700" fill="#1f2328">第 710,106 位</text><line x1="120" x2="1080" y1="1010" y2="1010" stroke="#e1ddd4" stroke-width="2"/>
  <text x="120" y="1080" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#878d94">硬币是虚构示例；π 的数字由本页自己算出后数的</text>
</svg>